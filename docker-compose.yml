services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: aether
      POSTGRES_DB: aether
    ports:
      - "5433:5432" # 5433 côté machine pour ne pas entrer en conflit avec un Postgres local
    volumes:
      - aether-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  aether-db:
